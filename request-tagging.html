<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Tag a paper — Meta-Tagging Platform</title>
<meta name="description" content="Check whether a paper can enter the manual $2 meta-tagging service before any payment is requested.">
<link rel="alternate" hreflang="en" href="request-tagging.html">
<link rel="alternate" hreflang="he" href="request-tagging-he.html">
<link rel="stylesheet" href="css/shell.css?v=c7c9bd7a">
<script src="js/theme.js?v=c7c9bd7a" defer></script>
<link rel="stylesheet" href="css/platform.css?v=c7c9bd7a">
<link rel="stylesheet" href="css/intake.css?v=c7c9bd7a">
<!-- The config must load BEFORE payments.js and WITHOUT defer: it carries the pay
     link, and payments.js decides on the strength of it whether this page can take
     money at all. Without it the page believed payments were off while the link was
     live - the pay button simply never appeared. -->
<script src="js/payments.config.js?v=c7c9bd7a"></script>
<script src="js/payments.js?v=c7c9bd7a" defer></script>
</head>
<body class="intake-page">

<div class="animated-background" aria-hidden="true">
  <div class="wave-container">
    <svg class="wave wave-teal" viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0,160 C320,220 420,100 720,160 C1020,220 1120,100 1440,160 L1440,320 L0,320 Z"></path></svg>
    <svg class="wave wave-pink" viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0,200 C280,260 380,140 680,200 C980,260 1080,140 1440,200 L1440,320 L0,320 Z"></path></svg>
    <svg class="wave wave-wine" viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0,240 C240,300 340,180 640,240 C940,300 1040,180 1440,240 L1440,320 L0,320 Z"></path></svg>
  </div>
  <div class="particles">
    <div class="particle particle-teal" style="left:10%;top:20%"></div><div class="particle particle-pink" style="left:30%;top:60%"></div>
    <div class="particle particle-wine" style="left:50%;top:30%"></div><div class="particle particle-teal" style="left:70%;top:70%"></div>
    <div class="particle particle-pink" style="left:90%;top:40%"></div><div class="particle particle-wine" style="left:20%;top:80%"></div>
  </div>
</div>

<main class="pt-wrap ask">
  <header class="pt-head">
    <a class="pt-back" href="index.html">← Platform</a>
    <a class="pt-btn lang-switch" href="request-tagging-he.html" hreflang="he">עברית</a>
  </header>

  <h1 class="ask-title">Tag a paper</h1>
  <p class="ask-price"><span data-price-for="tag_paper">$0.00</span> <span class="ask-unit">per accepted paper</span></p>

  <form id="askForm" class="ask-form" novalidate>
    <label class="ask-label" for="askField">The paper</label>
    <input class="ask-input" id="askField" name="askField" autocomplete="off"
           placeholder="DOI, link, or the title — or just attach the file" required>
    <input class="ask-file" id="askFile" type="file" accept=".mhtml,.mht,.pdf,.html">

    <button class="ask-go" type="submit">Continue</button>
  </form>

  <div id="askOut" class="ask-out" hidden></div>

  <p class="ask-refund">Everything else is read from the paper. If we cannot tag it, Shir refunds in full to the same PayPal account within 5 working days — shirsivroni@gmail.com.</p>
</main>

<script src="js/intake.js?v=c7c9bd7a"></script>

<script src="https://shir-openu.github.io/beacon.js" defer></script>
<script src="js/ask.js?v=c7c9bd7a" defer></script>
</body>
</html>
